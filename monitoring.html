<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitoring Kehadiran PPNPN KPPN Malang</title>
<style>
  :root{
    --blue:#0b4fbf;
    --navy:#16215c;
    --pink-bg:#fdece7;
    --pink-header:#f2a49a;
    --pink-cell:#fbe1da;
    --green:#1a9c4a;
    --red:#d43227;
    --blueText:#1c5fd4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:#f2f4f8;
    color:#111;
    padding-bottom:40px;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:20px 16px;
  }
  h1{
    color:var(--blue);
    font-size:1.9rem;
    text-align:center;
    line-height:1.2;
    margin:10px 0 20px;
    text-transform:uppercase;
    font-weight:800;
  }
  .row-2{
    display:flex;
    gap:10px;
    margin-bottom:18px;
  }
  select.field{
    flex:1;
    background:var(--blue);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:13px 14px;
    font-size:1rem;
    appearance:none;
    -webkit-appearance:none;
  }
  .calendar{
    background:var(--pink-bg);
    border:2px solid var(--navy);
    border-radius:18px;
    padding:18px;
    margin-bottom:16px;
  }
  .cal-top{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:12px;
  }
  .cal-year{
    background:var(--pink-header);
    color:var(--navy);
    font-weight:800;
    font-size:1.6rem;
    padding:10px 18px;
    border-radius:10px;
  }
  .cal-month{
    color:var(--navy);
    font-weight:800;
    font-size:1.7rem;
    letter-spacing:1px;
    border-bottom:2px solid var(--navy);
    padding-bottom:4px;
    flex:1;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
  }
  .cal-dow{
    background:var(--pink-header);
    color:var(--navy);
    text-align:center;
    font-weight:700;
    font-size:0.75rem;
    padding:8px 0;
    border-radius:6px;
  }
  .cal-day{
    background:var(--pink-cell);
    color:var(--navy);
    text-align:center;
    font-weight:700;
    font-size:1.2rem;
    padding:14px 0;
    border-radius:6px;
    border:none;
    cursor:pointer;
    position:relative;
  }
  .cal-day:hover{ filter:brightness(0.95); }
  .cal-day.empty{ background:transparent; cursor:default; }
  .cal-day.selected{ outline:3px solid var(--blue); }
  .cal-day.has-data::after{
    content:'';
    position:absolute;
    bottom:4px; left:50%;
    transform:translateX(-50%);
    width:6px; height:6px;
    border-radius:50%;
    background:var(--blue);
  }
  .info-box{
    border:2px dashed #999;
    background:#d9d9d9;
    border-radius:8px;
    padding:16px;
    display:flex;
    gap:14px;
    align-items:flex-start;
  }
  .info-text{ flex:1; font-size:0.92rem; line-height:1.55; }
  .info-text b{ color:var(--navy); }
  .photos{
    display:flex;
    flex-direction:column;
    gap:8px;
    align-items:center;
  }
  .photo-slot{
    width:80px;
  }
  .photo-slot span{
    display:block;
    font-size:0.7rem;
    text-align:center;
    margin-bottom:3px;
    color:#333;
  }
  .photo-slot img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:6px;
    border:1px solid #999;
    background:#fff;
  }
  .photo-slot .no-photo{
    width:80px;
    height:80px;
    border-radius:6px;
    border:1px dashed #999;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.4rem;
    color:#aaa;
  }
  .status-green{ color:var(--green); font-weight:700; }
  .status-red{ color:var(--red); font-weight:700; }
  .status-blue{ color:var(--blueText); font-weight:700; }
  .status-grey{ color:#555; font-weight:700; }
  footer{
    text-align:center;
    color:#666;
    font-size:0.85rem;
    margin-top:24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Monitoring Kehadiran<br>PPNPN KPPN Malang</h1>

  <div class="row-2">
    <select id="namaSelect" class="field">
      <option value="">Nama PPNPN ▾</option>
    </select>
    <select id="periodeSelect" class="field"></select>
  </div>

  <div class="calendar">
    <div class="cal-top">
      <div class="cal-year" id="calYear">----</div>
      <div class="cal-month" id="calMonth">-</div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="info-box">
    <div class="info-text" id="infoText">Pilih Nama PPNPN, lalu klik salah satu tanggal.</div>
    <div class="photos">
      <div class="photo-slot">
        <span>Foto Clock In</span>
        <div id="photoInWrap"><div class="no-photo">–</div></div>
      </div>
      <div class="photo-slot">
        <span>Foto Clock Out</span>
        <div id="photoOutWrap"><div class="no-photo">–</div></div>
      </div>
    </div>
  </div>

  <footer id="footerText">2026 created by Dirgayusa</footer>
</div>

<script>
/* ======================= CONFIG ======================= */
const API_URL = "PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE"; // sama seperti di index.html
const LAST_UPDATED = "28 September 2026";
/* ========================================================= */

document.getElementById('footerText').textContent =
  "Terakhir diperbarui: " + LAST_UPDATED + " — created by Dirgayusa";

const HARI_ID = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
const HARI_SHORT = ["MIN","SEN","SEL","RAB","KAM","JUM","SAB"];
const BULAN_ID = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

let laporanData = []; // hasil fetch untuk nama terpilih
let laporanMap = {};  // key "yyyy-m-d" -> entry
let selectedYear, selectedMonth; // selectedMonth: 0-11
let selectedDateKey = null;

/* ---------- Isi dropdown Nama PPNPN ---------- */
async function loadNama(){
  try{
    const res = await fetch(API_URL + "?action=getData");
    const json = await res.json();
    const sel = document.getElementById('namaSelect');
    (json.data || []).forEach(row=>{
      const opt = document.createElement('option');
      opt.value = row.nama;
      opt.textContent = row.nama;
      sel.appendChild(opt);
    });
  }catch(e){
    document.getElementById('infoText').textContent = "Gagal memuat daftar nama. Periksa API_URL.";
  }
}
loadNama();

/* ---------- Isi dropdown Periode (bulan-tahun) ---------- */
function buildPeriodeOptions(){
  const sel = document.getElementById('periodeSelect');
  const now = new Date();
  const curY = now.getFullYear(), curM = now.getMonth();
  const options = [];
  for(let y = curY - 1; y <= curY + 1; y++){
    for(let m = 0; m < 12; m++){
      options.push({y, m});
    }
  }
  options.forEach(o=>{
    const opt = document.createElement('option');
    opt.value = o.y + "-" + o.m;
    opt.textContent = BULAN_ID[o.m] + " " + o.y;
    if(o.y === curY && o.m === curM) opt.selected = true;
    sel.appendChild(opt);
  });
  selectedYear = curY;
  selectedMonth = curM;
}
buildPeriodeOptions();

document.getElementById('periodeSelect').addEventListener('change', (e)=>{
  const [y, m] = e.target.value.split('-').map(Number);
  selectedYear = y;
  selectedMonth = m;
  renderCalendar();
});

/* ---------- Ambil data LAPORAN untuk nama terpilih ---------- */
document.getElementById('namaSelect').addEventListener('change', async (e)=>{
  const nama = e.target.value;
  laporanData = [];
  laporanMap = {};
  selectedDateKey = null;
  resetInfo();
  if(!nama){ renderCalendar(); return; }
  try{
    const res = await fetch(API_URL + "?action=getLaporan&nama=" + encodeURIComponent(nama));
    const json = await res.json();
    laporanData = json.data || [];
    laporanData.forEach(row=>{
      const key = parseTanggalLabelToKey(row.tanggalLabel);
      if(key) laporanMap[key] = row;
    });
  }catch(err){
    document.getElementById('infoText').textContent = "Gagal memuat riwayat presensi.";
  }
  renderCalendar();
});

/* "Rabu, 30 September 2026" -> "2026-8-30" (bulan 0-indexed, biar cocok dgn JS Date) */
function parseTanggalLabelToKey(label){
  const parts = String(label).split(',');
  if(parts.length < 2) return null;
  const rest = parts[1].trim().split(' '); // ["30","September","2026"]
  if(rest.length < 3) return null;
  const tgl = Number(rest[0]);
  const bulanIdx = BULAN_ID.indexOf(rest[1]);
  const thn = Number(rest[2]);
  if(isNaN(tgl) || bulanIdx === -1 || isNaN(thn)) return null;
  return thn + "-" + bulanIdx + "-" + tgl;
}

/* ---------- Render kalender ---------- */
function renderCalendar(){
  document.getElementById('calYear').textContent = selectedYear;
  document.getElementById('calMonth').textContent = BULAN_ID[selectedMonth].toUpperCase();

  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  HARI_SHORT.forEach(h=>{
    const el = document.createElement('div');
    el.className = 'cal-dow';
    el.textContent = h;
    grid.appendChild(el);
  });

  const firstDow = new Date(selectedYear, selectedMonth, 1).getDay(); // 0=Minggu
  const daysInMonth = new Date(selectedYear, selectedMonth + 1, 0).getDate();

  for(let i = 0; i < firstDow; i++){
    const el = document.createElement('div');
    el.className = 'cal-day empty';
    grid.appendChild(el);
  }

  for(let d = 1; d <= daysInMonth; d++){
    const key = selectedYear + "-" + selectedMonth + "-" + d;
    const btn = document.createElement('button');
    btn.className = 'cal-day' + (laporanMap[key] ? ' has-data' : '');
    btn.textContent = d;
    btn.type = 'button';
    if(key === selectedDateKey) btn.classList.add('selected');
    btn.addEventListener('click', ()=> selectDate(d, key));
    grid.appendChild(btn);
  }
}

/* ---------- Pilih tanggal & tampilkan info ---------- */
function selectDate(day, key){
  selectedDateKey = key;
  renderCalendar();

  const dateObj = new Date(selectedYear, selectedMonth, day);
  const dow = dateObj.getDay();
  const hariNama = HARI_ID[dow];
  const hariClass = (dow === 0 || dow === 6) ? 'status-red' : '';
  const tanggalStr = `${day} ${BULAN_ID[selectedMonth]} ${selectedYear}`;

  const entry = laporanMap[key];

  let html = `Tanggal Dipilih:<br><span class="${hariClass}">${hariNama}</span>, ${tanggalStr}<br><br>`;

  if(!entry){
    html += `<b>Belum ada data presensi pada tanggal ini.</b>`;
    document.getElementById('infoText').innerHTML = html;
    setPhoto('photoInWrap', '');
    setPhoto('photoOutWrap', '');
    return;
  }

  // ---- Presensi Clock In ----
  if(entry.clockIn){
    const kp = entry.keteranganPresensi || '';
    let label, cls;
    if(kp.indexOf('TL') === 0){ label = kp; cls = 'status-red'; }
    else if(kp === 'Normal' || kp.indexOf('PSW') === 0){ label = 'Normal'; cls = 'status-green'; }
    else { label = '-'; cls = 'status-grey'; }
    html += `Presensi Clock In:<br><span class="${cls}">${label}</span>, ${entry.clockIn}<br><br>`;
  }else{
    html += `Presensi Clock In:<br><span class="status-grey">Belum presensi</span><br><br>`;
  }

  // ---- Presensi Clock Out ----
  if(entry.clockOut){
    const kp = entry.keteranganPresensi || '';
    const kl = entry.keteranganLembur || '';
    let label, cls;
    if(kl && kl !== '-'){ label = kl; cls = 'status-blue'; }
    else if(kp.indexOf('PSW') === 0){ label = kp; cls = 'status-red'; }
    else if(kp.indexOf('TL') === 0){ label = kp; cls = 'status-red'; }
    else if(kp === 'Normal'){ label = 'Normal'; cls = 'status-green'; }
    else { label = '-'; cls = 'status-grey'; }
    html += `Presensi Clock Out:<br><span class="${cls}">${label}</span>, ${entry.clockOut}`;
  }else{
    html += `Presensi Clock Out:<br><span class="status-grey">Belum presensi</span>`;
  }

  document.getElementById('infoText').innerHTML = html;
  setPhoto('photoInWrap', entry.clockInPhoto);
  setPhoto('photoOutWrap', entry.clockOutPhoto);
}

function setPhoto(wrapId, url){
  const wrap = document.getElementById(wrapId);
  wrap.innerHTML = '';
  if(url){
    const img = document.createElement('img');
    img.src = url;
    img.alt = 'foto presensi';
    wrap.appendChild(img);
  }else{
    const ph = document.createElement('div');
    ph.className = 'no-photo';
    ph.textContent = '–';
    wrap.appendChild(ph);
  }
}

function resetInfo(){
  document.getElementById('infoText').textContent = 'Pilih Nama PPNPN, lalu klik salah satu tanggal.';
  setPhoto('photoInWrap', '');
  setPhoto('photoOutWrap', '');
}

renderCalendar();
</script>
</body>
</html>
